name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Vercel credentials
        id: check_vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ Vercel deployment skipped: VERCEL_TOKEN secret not configured in repo settings."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy frontend to Vercel
        if: steps.check_vercel.outputs.configured == 'true'
        uses: vercel/action@main
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
        continue-on-error: true

      - name: Comment deployment URL
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✓ Frontend deployed to Vercel: ${{ steps.deploy.outputs.preview_url }}'
            })
        continue-on-error: true

  deploy-backend-hf:
    name: Deploy Backend to Hugging Face Spaces
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t crowd-flow-api:latest .

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Install HF CLI
          pip install huggingface-hub

          # Push Docker image to HF Spaces registry
          # Note: requires HF_TOKEN with write permissions
          echo "✓ Backend build ready for HF Spaces deployment"
          echo "  Manual steps:"
          echo "  1. Create HF Space: https://huggingface.co/spaces/new?sdk=docker"
          echo "  2. Clone the repo and push backend/Dockerfile"
          echo "  3. Set required environment variables in Space settings"
        continue-on-error: true

  deploy-backend-render:
    name: Deploy Backend to Render (Alternative)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-backend-render

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ℹ Render deployment not configured"
            echo "  To enable: add RENDER_DEPLOY_HOOK secret to repo"
            echo "  See: https://render.com/docs/deploy-hooks"
          else
            curl --no-progress-meter -X POST $RENDER_DEPLOY_HOOK
            echo "✓ Deployment triggered on Render"
          fi
        continue-on-error: true

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend-hf, deploy-backend-render]
    if: always()

    steps:
      - name: Print deployment status
        run: |
          echo "📦 Deployment Pipeline Summary"
          echo "================================"
          echo "Frontend (Vercel): ${{ needs.deploy-frontend.result }}"
          echo "Backend (HF Spaces): ${{ needs.deploy-backend-hf.result }}"
          echo "Backend (Render): ${{ needs.deploy-backend-render.result }}"
          echo ""
          echo "📋 Setup Instructions:"
          echo ""
          echo "1. VERCEL FRONTEND:"
          echo "   - Create project: https://vercel.com/new"
          echo "   - Add secrets to GitHub:"
          echo "     • VERCEL_TOKEN: https://vercel.com/account/tokens"
          echo "     • VERCEL_ORG_ID: from Vercel project settings"
          echo "     • VERCEL_PROJECT_ID: from Vercel project settings"
          echo ""
          echo "2. HUGGING FACE SPACES (RECOMMENDED):"
          echo "   - Create Space: https://huggingface.co/spaces/new"
          echo "   - Enable Docker SDK"
          echo "   - Add HF_TOKEN secret to GitHub"
          echo "   - Push backend files to Space repo"
          echo "   - Set ALLOWED_ORIGINS env in Space settings"
          echo ""
          echo "3. RENDER.COM (ALTERNATIVE):"
          echo "   - Create Web Service: https://render.com/register"
          echo "   - Connect GitHub repo"
          echo "   - Add RENDER_DEPLOY_HOOK secret to GitHub"
          echo ""
